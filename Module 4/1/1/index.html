<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4.1.1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <h1>Вычисление круга</h1>
  <label for="radius">Введите радиус:</label>
  <input type="number" id="radius" min="0" step="0.01">
  <label for="unit">Выберите единицу измерения:</label>
  <select id="unit">
    <option value="meters">Метры</option>
    <option value="centimeters">Сантиметры</option>
    <option value="inches">Дюймы</option>
  </select>
  <button onclick="calc()">Вычислить</button>
  <div id="results">
    <p>Длина окружности: <b><span id="circumference"></span></b></p>
    <p>Площадь круга: <b><span id="area"></span></b></p>
    <h3>Ответы даны в той единице, что вы выбрали ранее!</h3>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
